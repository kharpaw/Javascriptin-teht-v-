<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promting</title>
</head>
<body>
    <h1 id = "printing"></h1>
    <script>
        'use strict';
        let greet = prompt("What is you name ")
        document.querySelector("#printing").innerHTML = "My name is: " + greet + "!";
    </script>
</body>
</html>
